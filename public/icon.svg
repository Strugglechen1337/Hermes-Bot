<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="64" y1="24" x2="448" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#171c2b"/>
      <stop offset="100%" stop-color="#090b10"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="148" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="head" x1="256" y1="156" x2="256" y2="404" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbe2f0"/>
    </linearGradient>
    <linearGradient id="visor" x1="256" y1="210" x2="256" y2="352" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141926"/>
      <stop offset="100%" stop-color="#090b10"/>
    </linearGradient>
    <linearGradient id="amber" x1="256" y1="78" x2="256" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Rounded dark app tile -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  <rect x="18" y="18" width="476" height="476" rx="100" stroke="rgba(255,255,255,0.09)" stroke-width="4"/>

  <!-- Cute antenna -->
  <path d="M256 164V118" stroke="#cbd5e1" stroke-width="18" stroke-linecap="round"/>
  <circle cx="256" cy="102" r="26" fill="url(#amber)"/>
  <circle cx="248" cy="94" r="7" fill="#fffbeb" fill-opacity="0.85"/>

  <!-- Cute side ear pods -->
  <rect x="82" y="238" width="42" height="84" rx="21" fill="#cbd5e1"/>
  <rect x="388" y="238" width="42" height="84" rx="21" fill="#cbd5e1"/>
  <rect x="93" y="260" width="12" height="40" rx="6" fill="#f59e0b"/>
  <rect x="407" y="260" width="12" height="40" rx="6" fill="#f59e0b"/>

  <!-- Rounded cute robot head -->
  <rect x="114" y="160" width="284" height="236" rx="86" fill="url(#head)"/>

  <!-- Dark expressive visor -->
  <rect x="148" y="206" width="216" height="142" rx="52" fill="url(#visor)"/>

  <!-- Bright friendly glowing eyes with catchlights -->
  <circle cx="208" cy="268" r="24" fill="#fbbf24"/>
  <circle cx="304" cy="268" r="24" fill="#fbbf24"/>
  <circle cx="200" cy="260" r="7" fill="#ffffff"/>
  <circle cx="296" cy="260" r="7" fill="#ffffff"/>

  <!-- Cute little friendly smile -->
  <path d="M228 310C239 324 273 324 284 310" stroke="#fbbf24" stroke-width="11" stroke-linecap="round"/>
</svg>
