      <rect x="0" y="156" width="280" height="68" rx="16" fill="#111520"/>
      <circle cx="32" cy="190" r="20" fill="#be185d"/>
      <text x="32" y="196" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="15" font-weight="800">S</text>
