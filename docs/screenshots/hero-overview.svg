  </defs>

  <rect width="1200" height="660" rx="28" fill="url(#bg)"/>
  <circle cx="220" cy="140" r="240" fill="url(#glowCyan)" opacity="0.5"/>
  <circle cx="980" cy="520" r="260" fill="url(#glowCyan)" opacity="0.35"/>

  <!-- Left Phone: Bot List & Chief Showcase -->
  <g transform="translate(56, 36)">
    <rect x="0" y="0" width="320" height="588" rx="40" fill="#090b10" stroke="#25304a" stroke-width="3"/>
