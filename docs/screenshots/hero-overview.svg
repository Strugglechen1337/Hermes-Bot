    <!-- Quick Prompts + Composer -->
    <g transform="translate(28, 484)">
      <rect x="0" y="0" width="112" height="26" rx="13" fill="#151b2b" stroke="#28334e"/>
      <text x="56" y="17" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">Tages-Update</text>
      <rect x="120" y="0" width="108" height="26" rx="13" fill="#151b2b" stroke="#28334e"/>
      <text x="174" y="17" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">Einkaufsliste</text>
      <rect x="236" y="0" width="106" height="26" rx="13" fill="#151b2b" stroke="#28334e"/>
      <text x="289" y="17" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">Server-Check</text>
    </g>

    <rect x="28" y="520" width="676" height="46" rx="23" fill="#151926" stroke="#2a3550"/>
    <text x="56" y="548" fill="#64748b" font-family="sans-serif" font-size="14">Nova fragen… (oder per Mikrofon diktieren)</text>
    <circle cx="634" cy="543" r="15" fill="#1e293b"/>
    <text x="634" y="548" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="13">🎙</text>
    <circle cx="676" cy="543" r="16" fill="url(#amberGrad)"/>
    <text x="676" y="549" text-anchor="middle" fill="#090b10" font-family="sans-serif" font-size="15" font-weight="900">↑</text>
  </g>
