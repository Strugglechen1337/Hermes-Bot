    <text x="38" y="107" fill="#64748b" font-family="sans-serif" font-size="13">Bots &amp; Gespräche durchsuchen</text>

    <!-- Chief Showcase -->
    <g transform="translate(24, 136)">
      <circle cx="42" cy="36" r="32" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5"/>
      <text x="42" y="43" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="800">N</text>
      <circle cx="64" cy="58" r="11" fill="#f59e0b"/>
      <text x="64" y="62" text-anchor="middle" fill="#090b10" font-family="sans-serif" font-size="11" font-weight="900">★</text>
      <circle cx="66" cy="14" r="10" fill="#ef4444"/>
      <text x="66" y="18" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="10" font-weight="800">2</text>
      <text x="42" y="86" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">Nova</text>

      <circle cx="136" cy="36" r="30" fill="#172554" stroke="#38bdf8" stroke-width="2"/>
      <text x="136" y="43" text-anchor="middle" fill="#e0f2fe" font-family="sans-serif" font-size="21" font-weight="800">A</text>
      <text x="136" y="86" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">Atlas</text>

