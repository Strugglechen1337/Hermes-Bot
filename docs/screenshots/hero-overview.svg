    <text x="473" y="237" text-anchor="middle" fill="#090b10" font-family="sans-serif" font-size="12" font-weight="800">Öffnen</text>

    <!-- Interactive Checklist Card -->
    <rect x="48" y="280" width="480" height="148" rx="14" fill="#111622" stroke="#2b3550"/>
    <text x="66" y="304" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700">☑ Einkaufsliste</text>
    <text x="492" y="304" fill="#64748b" font-family="sans-serif" font-size="12">1/3</text>
    <text x="66" y="332" fill="#34d399" font-family="sans-serif" font-size="13">✓  Kaffeebohnen (erledigt)</text>
    <text x="66" y="358" fill="#e2e8f0" font-family="sans-serif" font-size="13">☐  Hafermilch &amp; frisches Brot</text>
    <text x="66" y="384" fill="#e2e8f0" font-family="sans-serif" font-size="13">☐  Äpfel &amp; Avocados</text>
    <rect x="374" y="394" width="138" height="24" rx="8" fill="#1e293b"/>
    <text x="443" y="410" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">Stand an Bot senden</text>

    <!-- Quick actions row -->
